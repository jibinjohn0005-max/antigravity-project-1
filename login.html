<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calvix | Sign In</title>
    <link rel="stylesheet" href="style.css">
    <script>
        // Redirect immediately if already logged in
        if (sessionStorage.getItem('calvix_logged_in') === 'true') {
            window.location.href = 'index.html';
        }
    </script>
</head>
<body>
    <div class="login-container">
        <main class="login-card">
            <header class="login-header">
                <div class="brand-centered">
                    <span class="brand-dot"></span>
                    <h1>Calvix</h1>
                </div>
                <p class="login-subtitle">Enter credentials to open the calculator</p>
            </header>

            <form id="login-form" class="login-form" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required placeholder="Enter username" autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="Enter password" autocomplete="current-password">
                </div>

                <div id="error-message" class="error-message" aria-live="polite" style="display: none;"></div>

                <button type="submit" class="btn-login">Sign In</button>
            </form>

            <footer class="login-footer">
                <p class="credentials-hint">Default Username: <strong>admin</strong></p>
                <p class="credentials-hint">Default Password: <strong>admin123</strong></p>
            </footer>
        </main>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const errorMessage = document.getElementById('error-message');

            const username = usernameInput.value.trim();
            const password = passwordInput.value;

            // Simple demonstration authentication check
            if (username === 'admin' && password === 'admin123') {
                sessionStorage.setItem('calvix_logged_in', 'true');
                window.location.href = 'index.html';
            } else {
                errorMessage.textContent = 'Invalid username or password';
                errorMessage.style.display = 'block';
                
                // Clear password field
                passwordInput.value = '';
                passwordInput.focus();
            }
        }
    </script>
</body>
</html>
